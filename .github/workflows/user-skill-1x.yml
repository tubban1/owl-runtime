name: 1.x User Skill Gate

on:
  pull_request:
    branches:
      - platform/contracts-v1
      - feature/1.x-user-skill-registry

permissions:
  contents: read

concurrency:
  group: user-skill-1x-${{ github.ref }}
  cancel-in-progress: true

jobs:
  user-skill-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Verify Skill ABI
        run: npm run verify:skill-abi

      - name: Verify Semantic Memory
        run: npm run verify:semantic-memory

      - name: Verify Public Runtime Client
        run: npm run verify:public-runtime-client

      - name: Verify HTTP Runtime Client
        run: npm run verify:http-runtime-client

      - name: Verify User Skill Registry
        run: npm run verify:user-skills

      - name: Verify Workflow Discovery
        run: npm run verify:workflow-discovery

      - name: Verify Public Event Journal
        run: npm run verify:public-events

      - name: Verify Consequential Request Replay
        run: npm run verify:request-replay

      - name: Build Public Types
        run: npm run build:types
