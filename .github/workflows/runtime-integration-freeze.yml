name: 1.x Runtime Integration Freeze Gate

on:
  push:
    branches:
      - feature/1.x-runtime-integration-freeze
  pull_request:
    branches:
      - main
      - feature/1.x-storage-legacy-migration

permissions:
  contents: read

concurrency:
  group: runtime-integration-freeze-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-integration-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: node --version
      - run: npm ci
      - run: npm run typecheck
      - run: npm run verify:request-replay
      - run: npm run verify:storage-key-provider
      - run: npm run verify:encrypted-metadata-store
      - run: npm run verify:storage-metadata-sqlite
      - run: npm run verify:execution-revision
      - run: npm run verify:execution-activation
      - run: npm run verify:approval-resume
      - run: npm run verify:public-dto
      - run: npm run verify:schedule-pause-resume
      - run: npm run verify:storage-foundation
      - run: npm run verify:storage-retention
      - run: npm run verify:legacy-storage-migration
      - run: npm run verify:runtime-integration-freeze
      - run: npm run verify:detached-task-progress
      - run: npm run verify:public-runtime-client
      - run: npm run verify:http-runtime-client
      - run: npm run verify:mcp-session-reconnect
      - run: npm run build:types
      - run: npm run build
